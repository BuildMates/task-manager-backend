name: Backend CD development

on:
  workflow_run:
    workflows:
      - Backend CI
    branches:
      - main
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-development:
    name: Deploy backend to development
    runs-on: ubuntu-latest
    environment: development

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    env:
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || secrets.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || secrets.ECR_REPOSITORY }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY || secrets.ECR_REGISTRY }}
      EC2_HOST: ${{ vars.EC2_HOST || secrets.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER || secrets.EC2_USER }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .

      - name: Push Docker image to ECR
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" << EOF
            set -e

            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            docker stop task-manager-backend || true
            docker rm task-manager-backend || true

            docker run -d \
              --name task-manager-backend \
              --restart unless-stopped \
              -p 8000:8000 \
              $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            docker image prune -f
          EOF

      - name: Verify health check
        run: |
          for i in {1..10}; do
            if curl --fail http://$EC2_HOST:8000/api/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 5
          done

          echo "Health check failed"
          exit 1