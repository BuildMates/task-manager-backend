name: Backend CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff httpx

      - name: Run lint check
        run: |
          ruff check .

      - name: Run tests
        run: |
          python -m pytest

      - name: Build Docker image
        run: |
          docker build -t task-manager-backend:ci .

      - name: Run Docker container for health check
        run: |
          docker run -d \
            --name task-manager-backend-ci \
            -p 8000:8000 \
            task-manager-backend:ci

          sleep 10

          curl --fail http://127.0.0.1:8000/api/health

      - name: Show Docker logs if needed
        if: always()
        run: |
          docker logs task-manager-backend-ci || true

      - name: Stop Docker container
        if: always()
        run: |
          docker stop task-manager-backend-ci || true
          docker rm task-manager-backend-ci || true